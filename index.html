<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- YENİ 1: user-scalable=no kaldırıldı. Artık iOS ve Android'de harika bir şekilde iki parmakla yakınlaştırma (zoom) yapılabilecek! -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bellis Deluxe Otel Haritası</title>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- Temel Ayarlar --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #111111; /* Harita arkasında kalacak şık koyu zemin */
      font-family: 'Montserrat', sans-serif; 
      /* overflow: hidden SİLİNDİ: Artık haritada özgürce kaydırma ve zoom yapılabilecek */
    }

    /* --- Karşılama Ekranı Stilleri --- */
    #welcomeScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #f7f8fa; 
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999; 
      color: #333; 
      text-align: center;
    }

    .welcome-content {
      background: #ffffff; 
      padding: 0 40px 50px 40px; 
      border-radius: 30px;
      /* YENİ 2: İnce, zarif gold üst çizgi ve çok hafif gold aura gölgesi */
      border-top: 4px solid #c9a063;
      box-shadow: 0 20px 50px rgba(0,0,0,0.05), 0 0 30px rgba(201, 160, 99, 0.04); 
      max-width: 90%;
      width: 460px;
      margin-top: 50px; 
    }

    .logo-container {
      width: 120px;
      height: 120px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin: -60px auto 25px auto; 
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #f0f0f0;
      padding: 15px;
    }

    .welcome-logo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .hotel-title {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      color: #1a1a1a;
      letter-spacing: 2px;
      line-height: 1.2;
      margin-bottom: 5px;
    }

    .hotel-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      letter-spacing: 6px;
      color: #c9a063; 
      font-weight: 600;
      display: block;
      margin-top: 5px;
    }

    .app-title {
      font-size: 12px;
      letter-spacing: 2px;
      color: #888;
      font-weight: 400;
      margin-bottom: 30px;
      margin-top: 20px;
      position: relative;
    }

    /* YENİ 2: Yazının altındaki zarif gold ayraç çizgisi */
    .app-title::after {
      content: "";
      display: block;
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #c9a063, #e5c07b);
      margin: 15px auto 0;
      border-radius: 2px;
    }

    .welcome-text {
      margin-bottom: 30px;
      font-size: 15px;
      color: #555;
      line-height: 1.5;
    }

    /* Dil Seçimi ve Butonlar */
    .lang-selector {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
    }
    
    .lang-btn {
      background-color: #f4f4f4;
      color: #777;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .lang-btn:hover { background-color: #e8e8e8; }
    .lang-btn.active {
      background-color: #c9a063;
      color: white;
      box-shadow: 0 6px 15px rgba(201, 160, 99, 0.35);
    }
    
    .lang-flag { font-size: 16px; }

    .selection-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .select-btn {
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      text-align: left;
    }

    #btnInteractive, #btnInteractiveEN, #btnInteractiveRU {
      background: linear-gradient(135deg, #d4af37 0%, #aa8327 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(184, 134, 11, 0.25);
    }

    #btnClean, #btnCleanEN, #btnCleanRU {
      background-color: #ffffff;
      color: #333;
      border: 1px solid #e0e0e0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .select-btn:active { transform: scale(0.98); }

    /* --- YENİ 1: Mükemmel Ortalanan ve Zoom Yapılabilen Harita Yapısı --- */
    #mapArea {
      display: none; /* JS ile flex yapılacak */
      width: 100%;
      min-height: 100vh; /* Ekranı tam kaplar ama taşarsa kaydırma sağlar */
      justify-content: center; /* Yatayda ortalar */
      align-items: center; /* Dikeyde ortalar */
      padding: 20px 0; /* Geri butonu için üstte nefes alma payı */
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px; /* Tablet ve bilgisayarda devasa olmasını engeller, mobilde zaten %100'dür */
      box-shadow: 0 0 40px rgba(0,0,0,0.8); /* Haritanın zeminle bütünleşmesi için şık bir gölge */
    }
    
    .map-image {
      width: 100%;
      height: auto; /* Oranı korur, esnemez */
      display: block;
    }

    .pin {
      position: absolute;
      width: 22px;  
      height: 22px; 
      background: radial-gradient(circle at center, #c9a063 0%, #b8860b 100%);
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.4);
      cursor: pointer;
      animation: bellisPulse 2.5s infinite;
      z-index: 10;
      transition: transform 0.2s ease-out;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 11px;
    }

    .pin:active { transform: translate(-50%, -50%) scale(1.1); }

    @keyframes bellisPulse {
      0% { box-shadow: 0 0 0 0 rgba(201, 160, 99, 0.7), 0 4px 6px rgba(0,0,0,0.4); }
      70% { box-shadow: 0 0 0 10px rgba(201, 160, 99, 0), 0 4px 6px rgba(0,0,0,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(201, 160, 99, 0), 0 4px 6px rgba(0,0,0,0.4); }
    }

    /* Geri Gelme Butonu - Sabitlendi (Fixed) */
    #btnBack {
      position: fixed; /* Ekranı kaydırsan da zoom yapsan da sol üstte kalır */
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: #ffffff;
      color: #333;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    #btnBack:hover {
      background: #f8f9fb;
      transform: scale(1.05);
    }
    
    #btnBack:active { transform: translateY(2px); }

    /* Modal Stilleri */
    .modal-overlay {
      display: none;
      position: fixed; /* Modal daima ekranda sabit kalır */
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 30px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #f0f0f0;
      color: #333;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .lang-section { margin-bottom: 22px; }
    .lang-section h3 { font-size: 18px; color: #1a1a1a; margin-bottom: 6px; font-weight: 700; }
    .lang-section p { font-size: 14px; color: #666; line-height: 1.6; }
    .flag { font-size: 18px; margin-right: 8px; vertical-align: middle; }

    .photo-gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 25px;
    }
    
    .photo-gallery img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      height: 220px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <!-- Karşılama ve Seçim Ekranı -->
  <div id="welcomeScreen">
    <div class="welcome-content">
      
      <div class="logo-container">
        <img src="bellis-logo.png" alt="Bellis Deluxe Logo" class="welcome-logo" onerror="this.style.display='none'">
      </div>
      
      <h1 class="hotel-title">BELLIS<br><span class="hotel-subtitle">DELUXE HOTEL</span></h1>
      <div class="app-title">DİJİTAL TESİS HARİTASI</div>
      
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="tr" onclick="changeWelcomeLang('tr')">
          <span class="lang-flag">🇹🇷</span> TR
        </button>
        <button class="lang-btn" data-lang="en" onclick="changeWelcomeLang('en')">
          <span class="lang-flag">🇬🇧</span> EN
        </button>
        <button class="lang-btn" data-lang="ru" onclick="changeWelcomeLang('ru')">
          <span class="lang-flag">🇷🇺</span> RU
        </button>
      </div>
      
      <div id="welcome-content-tr">
        <p class="welcome-text">Hoş geldiniz. Tesisimizi keşfetmek için lütfen seçiminizi yapınız:</p>
        <div class="selection-buttons">
          <button id="btnInteractive" class="select-btn" onclick="showInteractiveMap()">
            <i data-lucide="map-pin"></i> Fotoğraflı harita için tıklayın.
          </button>
          <button id="btnClean" class="select-btn" onclick="showCleanMap()">
            <i data-lucide="map"></i> Tesisimizin detaylı haritası için tıklayın.
          </button>
        </div>
      </div>
      
      <div id="welcome-content-en" style="display: none;">
        <p class="welcome-text">Welcome. Please make your selection to explore our facility:</p>
        <div class="selection-buttons">
          <button id="btnInteractiveEN" class="select-btn" onclick="showInteractiveMap()">
            <i data-lucide="map-pin"></i> Click for the map with photos.
          </button>
          <button id="btnCleanEN" class="select-btn" onclick="showCleanMap()">
            <i data-lucide="map"></i> Click for the detailed map of our facility.
          </button>
        </div>
      </div>
      
      <div id="welcome-content-ru" style="display: none;">
        <p class="welcome-text">Добро пожаловать. Пожалуйста, сделайте выбор, чтобы изучить наш отель:</p>
        <div class="selection-buttons">
          <button id="btnInteractiveRU" class="select-btn" onclick="showInteractiveMap()">
            <i data-lucide="map-pin"></i> Нажмите для карты с фото.
          </button>
          <button id="btnCleanRU" class="select-btn" onclick="showCleanMap()">
            <i data-lucide="map"></i> Нажмите для подробной карты нашей территории.
          </button>
        </div>
      </div>
      
    </div>
  </div>

  <!-- YENİ: Haritayı İçine Alan ve Ortalamayı Sağlayan Dış Alan -->
  <div id="mapArea">
    <button id="btnBack" onclick="showWelcomeScreen()">
      <i data-lucide="arrow-left"></i> <span id="backBtnText">Geri</span>
    </button>
    
    <!-- Pinlerin Düzgün Hizalanması İçin Ana Taşıyıcı -->
    <div class="map-wrapper" id="mapWrapper">
      <img id="mainMapImage" src="bellis-plan.jpg" alt="Bellis Deluxe Otel Planı" class="map-image">
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="infoModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">Kapat X</button>
      <div id="modalData"></div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let currentWelcomeLang = 'tr';

    function changeWelcomeLang(lang) {
      document.getElementById('welcome-content-' + currentWelcomeLang).style.display = 'none';
      document.querySelector('.lang-btn.active').classList.remove('active');
      
      currentWelcomeLang = lang;
      document.getElementById('welcome-content-' + lang).style.display = 'block';
      document.querySelector('.lang-btn[data-lang="' + lang + '"]').classList.add('active');
      
      const backText = document.getElementById('backBtnText');
      if(lang === 'en') backText.innerText = 'Back';
      else if(lang === 'ru') backText.innerText = 'Назад';
      else backText.innerText = 'Geri';
    }

    const mainMapImage = document.getElementById('mainMapImage');

    function showInteractiveMap() {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('mapArea').style.display = 'flex'; // Dış yapıyı gösteriyoruz
      
      mainMapImage.src = 'bellis-plan.jpg'; 
      
      const pins = document.querySelectorAll('.pin');
      pins.forEach(pin => pin.style.display = 'flex');
    }

    function showCleanMap() {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('mapArea').style.display = 'flex'; // Dış yapıyı gösteriyoruz
      
      mainMapImage.src = 'temiz-plan.jpg'; 
      
      const pins = document.querySelectorAll('.pin');
      pins.forEach(pin => pin.style.display = 'none');
    }

    function showWelcomeScreen() {
      document.getElementById('mapArea').style.display = 'none';
      document.getElementById('welcomeScreen').style.display = 'flex';
      closeModal();
    }

    const mapWrapper = document.getElementById('mapWrapper');
    const modal = document.getElementById('infoModal');
    const modalData = document.getElementById('modalData');

    locations.forEach(loc => {
      const pin = document.createElement('div');
      pin.className = 'pin';
      pin.style.left = loc.x + '%';
      pin.style.top = loc.y + '%';
      
      pin.innerHTML = `<span>${loc.pinNum}</span>`; 
      
      pin.onclick = () => openModal(loc);
      
      mapWrapper.appendChild(pin);
    });

    function openModal(loc) {
      const photo1 = loc.photos[0] ? loc.photos[0] : 'https://via.placeholder.com/400x200?text=Fotoğraf+1';
      const photo2 = loc.photos[1] ? loc.photos[1] : 'https://via.placeholder.com/400x200?text=Fotoğraf+2';

      modalData.innerHTML = `
        <div class="lang-section">
          <h3><span class="flag">🇹🇷</span>${loc.tr.title}</h3>
          <p>${loc.tr.desc}</p>
        </div>
        <div class="lang-section">
          <h3><span class="flag">🇬🇧</span>${loc.en.title}</h3>
          <p>${loc.en.desc}</p>
        </div>
        <div class="lang-section">
          <h3><span class="flag">🇷🇺</span>${loc.ru.title}</h3>
          <p>${loc.ru.desc}</p>
        </div>
       <div class="photo-gallery">
          <img src="${photo1}" alt="${loc.tr.title} Fotoğraf 1" loading="lazy" onerror="this.src='https://via.placeholder.com/400x200?text=Fotoğraf+Eklenmedi'">
          <img src="${photo2}" alt="${loc.tr.title} Fotoğraf 2" loading="lazy" onerror="this.src='https://via.placeholder.com/400x200?text=Fotoğraf+Eklenmedi'">
        </div>
      `;
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    modal.onclick = function(e) {
      if(e.target === modal) closeModal();
    }
  </script>
